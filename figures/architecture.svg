   <g id="text_1">
    <text style="font: 700 16px 'DejaVu Sans'; text-anchor: middle" x="435.9" y="28.569767" transform="rotate(-0 435.9 28.569767)">3D coordinate PINN: three experts + one pointwise readout</text>
   </g>
   <g id="text_2">
    <text style="font: 11px 'DejaVu Sans'; text-anchor: middle" x="435.9" y="88.591126" transform="rotate(-0 435.9 88.591126)">Input: normalized (x, y, z) + material tag</text>
   </g>
   <g id="text_3">
    <text style="font: 10px 'DejaVu Sans'; text-anchor: middle" x="435.9" y="144.678837" transform="rotate(-0 435.9 144.678837)">Fixed routing: evaluate only the assigned expert at each point</text>
   </g>
   <g id="text_4">
    <text style="font: 11px 'DejaVu Sans'" transform="translate(122.105078 210.888723)">MEA expert</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(89.759062 225.713801)">6 → 48 → 48 → 48 → 10</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(104.277344 240.538879)">5,530 parameters</text>
   </g>
   <g id="text_5">
    <text style="font: 11px 'DejaVu Sans'" transform="translate(391.303594 210.888723)">GC / GDL expert</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(375.485937 225.713801)">9 → 48 → 48 → 48 → 9</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(386.504844 240.538879)">5,625 parameters</text>
   </g>
   <g id="text_6">
    <text style="font: 11px 'DejaVu Sans'" transform="translate(691.453359 210.888723)">BP expert</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(657.713437 225.713801)">5 → 24 → 24 → 24 → 2</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(668.732344 240.538879)">1,394 parameters</text>
   </g>
   <g id="text_7">
    <text style="font: 11px 'DejaVu Sans'" transform="translate(249.058125 340.465099)">Aligned 21 expert slots (10 + 9 + 2) + 11 global material tags = 32</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(275.78125 355.290177)">Only the routed expert fills its block; other blocks are zero</text>
   </g>
   <g id="text_8">
    <text style="font: 11px 'DejaVu Sans'; text-anchor: middle" x="435.9" y="444.981174" transform="rotate(-0 435.9 444.981174)">Common residual readout: 32 → 16 → 10  |  698 parameters</text>
   </g>
   <g id="text_9">
    <text style="font: 10.5px 'DejaVu Sans'" transform="translate(229.261641 535.128948)">Mapped expert output + readout correction → active mask → physical decoder</text>
    <text style="font: 10.5px 'DejaVu Sans'" transform="translate(244.045312 549.280159)">Private decoder/offsets withheld; public code returns dimensionless slots</text>
   </g>
   <g id="text_10">
    <text style="fill: #334d60; font: 11px 'DejaVu Sans'; text-anchor: middle" x="435.9" y="601.279535" transform="rotate(-0 435.9 601.279535)">Total 13,247 parameters  •  tanh / float64  •  no attention between spatial samples</text>
   </g>
  </g>
